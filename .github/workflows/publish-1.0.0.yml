name: Publish 1.0.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.0.0.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-upload-1.0.0
      - name: Create release and upload signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.0.0 release-upload/XposedClipLinkRouter-1.0.0-release.apk release-upload/SHA256SUMS.txt --verify-tag --title 'XposedClipLinkRouter 1.0.0' --notes '首次发布：识别剪贴板中的链接和分享口令，按规则打开目标应用或浏览器。需要 Android 15 及以上版本和兼容的 LSPosed 环境。安装后在 LSPosed 中启用模块、勾选系统框架作用域并重启设备。'
