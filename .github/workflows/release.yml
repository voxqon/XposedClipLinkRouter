name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test release automation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate tag and prepare release notes
        run: python3 .github/scripts/release.py prepare
      - name: Check preinstalled Android SDK 35
        shell: bash
        run: |
          : "${ANDROID_HOME:?Android SDK root is not configured on the runner}"
          test -r "$ANDROID_HOME/platforms/android-35/android.jar" || {
            echo '::error::The runner is missing Android SDK Platform 35.'
            exit 1
          }
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || {
            echo '::error::The runner is missing Android Build Tools 35.0.0 (apksigner).'
            exit 1
          }
      - name: Test, build, and verify signed APK
        env:
          CLIPLINK_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          CLIPLINK_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          CLIPLINK_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CLIPLINK_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: python3 .github/scripts/release.py build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish
      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          if [ -n "${CLIPLINK_RELEASE_DIR:-}" ]; then
            rm -rf -- "$CLIPLINK_RELEASE_DIR"
          fi
